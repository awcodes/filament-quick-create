laravel: '@testbench'

providers:
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - AUTH_MODEL='Workbench\App\Models\User'

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - filament-assets
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
